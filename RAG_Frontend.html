<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>RAG App</title>
  <style>
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      margin: 0;
      padding: 2rem;
      background: url('./O9FG5M0.jpg') no-repeat center center fixed;
      background-size: cover;
      color: #fff;
    }

    textarea, input[type="text"], button {
      width: 100%;
      padding: 0.75rem;
      margin: 0.5rem 0;
      border: none;
      border-radius: 8px;
      font-size: 1rem;
    }

    textarea, input[type="text"] {
      background: black;
      color: green;
    }

    button {
      background-color: #4CAF50;
      color: white;
      cursor: pointer;
      transition: background-color 0.3s ease;
    }

    button:hover {
      background-color: #45a049;
    }

    .hidden { display: none; }

    .button-row {
      display: flex;
      gap: 1rem;
      margin-top: 1rem;
    }

    .button-row button {
      flex: 1;
    }

    #answer-section, #query-section, #upload-section, #next-actions {
      background: whitesmoke;
      padding: 2rem;
      margin-top: 1rem;
      border-radius: 12px;
      box-shadow: 0 0 10px rgba(0,0,0,0.4);
    }

    h2, h3 {
      color: whitesmoke;
      text-decoration: solid;
      margin-bottom: 1rem;
    }

    #answer {
      background-color: rgba(255, 255, 255, 0.9);
      color: #000;
      padding: 1rem;
      border-radius: 10px;
      margin-top: 0.5rem;
      white-space: pre-wrap;
    }

    /* Loader styling */
    .loader {
      border: 4px solid #f3f3f3;
      border-top: 4px solid #3498db;
      border-radius: 50%;
      width: 30px;
      height: 30px;
      animation: spin 2s linear infinite;
      margin: auto;
      display: block;
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <h2>🧠 RAG Assistant</h2>

  <div id="upload-section">
    <h3>Step 1: Upload your text</h3>
    <textarea id="inputText" rows="6" placeholder="Paste your text here..."></textarea>
    <button onclick="loadText()">📤 Load Text</button>
  </div>

  <div id="query-section" class="hidden">
    <h3>Step 2: Ask a question</h3>
    <input type="text" id="queryInput" placeholder="Enter your query"/>
    <button onclick="askQuery()">🔍 Submit Query</button>
  </div>

  <div id="answer-section" class="hidden">
    <h3>Answer:</h3>
    <p id="answer"></p>
    <button onclick="speakAnswer()">🔊 Speak Answer</button>
    <button onclick="copyAnswer()">📋 Copy Answer</button>
    <div class="button-row">
      <button onclick="submitFeedback('satisfied')">✅ Satisfied</button>
      <button onclick="submitFeedback('not_satisfied')">🔁 Not Satisfied</button>
    </div>
  </div>

  <div id="next-actions" class="hidden">
    <h3>What would you like to do next?</h3>
    <div class="button-row">
      <button onclick="continueWithSameText()">📌 Query on Same Text</button>
      <button onclick="reloadForNewText()">🆕 Upload New Text</button>
    </div>
  </div>

  <!-- Loader added -->
  <div id="loader" class="hidden">
    <div class="loader"></div>
  </div>

  <script>
    let currentQuery = '';
    let currentAnswer = '';

    // Function to load text and show the loader
    function loadText() {
      const text = document.getElementById('inputText').value;
      console.log('Loading text:', text); // Debugging line

      // Show loader
      document.getElementById('loader').classList.remove('hidden');

      fetch('http://localhost:5000/load-text', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ text })
      })
      .then(res => res.json())
      .then(data => {
        console.log('Response data:', data); // Debugging line
        alert(data.message || data.error);
        
        // Hide loader
        document.getElementById('loader').classList.add('hidden');

        if (!data.error) {
          document.getElementById('query-section').classList.remove('hidden');
          document.getElementById('upload-section').classList.add('hidden');
        }
      })
      .catch(error => {
        // Hide loader on error
        document.getElementById('loader').classList.add('hidden');
        console.error('Error:', error); // Debugging line for any fetch errors
      });
    }

    // Function to submit query and show loader during query
    function askQuery() {
      const query = document.getElementById('queryInput').value;
      currentQuery = query;

      // Show loader while making the query request
      document.getElementById('loader').classList.remove('hidden');

      fetch('http://localhost:5000/query', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ query })
      })
      .then(res => res.json())
      .then(data => {
        // Hide loader after query response
        document.getElementById('loader').classList.add('hidden');

        if (data.answer) {
          currentAnswer = data.answer;
          document.getElementById('answer').textContent = data.answer;
          document.getElementById('answer-section').classList.remove('hidden');
        } else {
          alert(data.error);
        }
      })
      .catch(error => {
        // Hide loader on error
        document.getElementById('loader').classList.add('hidden');
        console.error('Error:', error);
      });
    }

    // Submit feedback
    function submitFeedback(feedback) {
      fetch('http://localhost:5000/feedback', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ query: currentQuery, answer: currentAnswer, feedback })
      })
      .then(res => res.json())
      .then(data => {
        if (feedback === 'not_satisfied' && data.answer) {
          document.getElementById('answer').textContent = data.answer;
          currentAnswer = data.answer;
        } else if (feedback === 'satisfied') {
          document.getElementById('next-actions').classList.remove('hidden');
          document.getElementById('query-section').classList.add('hidden');
          document.getElementById('answer-section').classList.add('hidden');
          document.getElementById('queryInput').value = "";
        }
      });
    }

    // Continue querying with the same text
    function continueWithSameText() {
      document.getElementById('query-section').classList.remove('hidden');
      document.getElementById('next-actions').classList.add('hidden');
    }

    // Reload for new text
    function reloadForNewText() {
      document.getElementById('upload-section').classList.remove('hidden');
      document.getElementById('query-section').classList.add('hidden');
      document.getElementById('answer-section').classList.add('hidden');
      document.getElementById('next-actions').classList.add('hidden');
      document.getElementById('inputText').value = '';
      document.getElementById('queryInput').value = '';
    }

    // Speak the answer
    function speakAnswer() {
      const answerText = document.getElementById('answer').textContent;
      const utterance = new SpeechSynthesisUtterance(answerText);
      utterance.rate = 1;
      utterance.pitch = 1;
      utterance.lang = 'en-US';
      window.speechSynthesis.speak(utterance);
    }

    // Copy answer to clipboard
    function copyAnswer() {
      const answerText = document.getElementById('answer').textContent;
      navigator.clipboard.writeText(answerText).then(() => {
        alert("Answer copied to clipboard!");
      }).catch(err => {
        console.error("Error copying text: ", err);
      });
    }
  </script>
</body>
</html>
